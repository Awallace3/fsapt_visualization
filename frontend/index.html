<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FSAPT Visualizer</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="panel viewer-panel">
        <div class="viewer-head">
          <h2>Molecular View</h2>
          <div class="heatmap-controls">
            <label for="focusMonomer">Focus monomer</label>
            <select id="focusMonomer">
              <option value="A">Monomer A fragment</option>
              <option value="B">Monomer B fragment</option>
            </select>
            <label for="focusFragment">Focus fragment</label>
            <select id="focusFragment"></select>
            <label for="heatmapComponent">Heatmap component</label>
            <select id="heatmapComponent">
              <option value="Total">Total</option>
              <option value="Elst">Elst</option>
              <option value="Exch">Exch</option>
              <option value="Ind">Ind</option>
              <option value="Disp">Disp</option>
            </select>
            <label for="heatmapMin">Min</label>
            <input id="heatmapMin" type="number" step="any" />
            <label for="heatmapMax">Max</label>
            <input id="heatmapMax" type="number" step="any" />
            <button id="applyHeatmapBtn" type="button">Apply Heatmap</button>
            <button id="savePngBtn" type="button">Save PNG</button>
          </div>
        </div>
        <div id="viewer"></div>
        <div class="legend-wrap">
          <span class="legend-label">Blue: stabilizing (negative)</span>
          <div class="legend-bar" aria-hidden="true"></div>
          <span class="legend-label">Red: destabilizing (positive)</span>
          <span id="heatmapRange" class="legend-range">Range: n/a</span>
        </div>
      </section>

      <section class="panel controls">
        <h1>FSAPT Prototype</h1>
        <p class="subtitle">
          Visualize fragment-pair energies and ML vs Psi4 errors using 3Dmol.js.
        </p>

        <div class="button-row">
          <button id="loadExampleBtn" type="button">Load AP3 Example</button>
          <button id="parseBtn" type="button">Parse Molecule</button>
          <button id="runMlBtn" type="button">Run ML</button>
          <button id="runCompareBtn" type="button">Run ML + Psi4 Compare</button>
        </div>

        <label for="moleculeInput">QCE Molecule String</label>
        <textarea id="moleculeInput" rows="16"></textarea>

        <div class="fragment-grid">
          <div>
            <label for="fragAInput">Fragments A (one per line: Name: indices)</label>
            <textarea id="fragAInput" rows="7"></textarea>
          </div>
          <div>
            <label for="fragBInput">Fragments B (one per line: Name: indices)</label>
            <textarea id="fragBInput" rows="7"></textarea>
          </div>
        </div>

        <p id="status" class="status">Ready.</p>
      </section>

      <section class="panel results">
        <div class="results-head">
          <h2>Component Energies</h2>
          <button id="toggleSourceBtn" type="button">Showing: ML</button>
        </div>
        <p class="hint">Click a row to highlight its fragment pair in the viewer.</p>
        <div class="table-wrap">
          <table id="resultsTable">
            <thead>
              <tr>
                <th>Frag1</th>
                <th>Frag2</th>
                <th id="colTotal">Total</th>
                <th id="colElst">Elst</th>
                <th id="colExch">Exch</th>
                <th id="colInd">Ind</th>
                <th id="colDisp">Disp</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>

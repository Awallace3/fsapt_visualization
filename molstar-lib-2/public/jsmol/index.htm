<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Index Page</title>
<script type="text/javascript" src="/jsmol/JSmol.min.js"></script>
<script type="text/javascript">

Jmol._isAsync = true;

var jmolApplet0;

Jmol._debugCode = false;

var messageEvent = null;

jmolScript = function(script) {
	messageEvent.source.postMessage({ type: 'lh-mol-viewer', data: 'processing_started' }, messageEvent.origin);
	Jmol.script(jmolApplet0, script)
}
jmolShowInfo = function(show) {
	Jmol.showInfo(jmolApplet0, true);
	Jmol.clearConsole(jmolApplet0);
}
hasStructCallback = function() {
	messageEvent.source.postMessage({ type: 'lh-mol-viewer', data: 'complete' }, messageEvent.origin);
}

var Info = {
	width: '100%',
	height: '100%',
	debug: false,
	color: "0xFFFFFF",
	addSelectionOptions: false,
	use: "HTML5",
	j2sPath: "/jsmol/j2s",
	jarPath: "java",
	jarFile: "JmolAppletSigned.jar",
	isSigned: true,
	serverURL: "/jsmol/php/jsmol.php",
	disableJ2SLoadMonitor: true,
  disableInitialConsole: true,
  allowJavaScript: true
}

$(document).ready(function() {
  $("#appdiv").html(Jmol.getAppletHtml("jmolApplet0", Info))
	Jmol.script(jmolApplet0, 'set loadStructCallback "hasStructCallback"; ');

	window.addEventListener("message", function(event) {
		// Check if the origin of the data is trusted.
    const eventUrl = new URL(event.origin);
    const windowUrl = new URL(window.location.origin);
    if (eventUrl.hostname !== windowUrl.hostname) {
        return;
    }

		messageEvent = event;
		const { type, data } = event.data;
		if (type === 'lh-mol-viewer') {
			Jmol.script(jmolApplet0, data);
		} else {
			// console.log('Send the input back to the sender');
			// event.source.postMessage({ type: 'lh-mol-viewer-back', data: 'wrong type' }, event.origin);
		}
	})
})

</script>
</head>
<body>
	<div id="jsmolApp" style="align-items: center; display: flex; justify-content: center; height: 100%; width: 100%; overflow: hidden;">
		<div id="jsmolFullContainer" style="width: 100%; height: 100%;">
			<div style="text-align: center; height: 90vh; display: flex; justify-content: center;">
				<div id="appdiv" style="width: 100%; height: 100%;"></div>
			 </div>
		</div>
	</div>
</body>
</html>
